<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF转Markdown工具</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .section {
            margin-bottom: 30px;
            padding: 20px;
            border: 1px solid #dee2e6;
            border-radius: 5px;
        }
        .section-title {
            margin-bottom: 15px;
            color: #0d6efd;
            font-weight: bold;
        }
        .progress {
            height: 25px;
        }
        .log-container {
            max-height: 200px;
            overflow-y: auto;
            background-color: #f8f9fa;
            padding: 10px;
            border: 1px solid #dee2e6;
            border-radius: 5px;
        }
        .log-entry {
            margin: 5px 0;
            font-family: monospace;
        }
        .hidden-file-input {
            display: none;
        }
        .btn-group {
            margin-bottom: 10px;
        }
        .settings-row {
            margin-bottom: 15px;
        }
        .file-list {
            margin-top: 10px;
            padding: 10px;
            background-color: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 5px;
            max-height: 150px;
            overflow-y: auto;
        }
        .file-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 5px;
            border-bottom: 1px solid #dee2e6;
        }
        .file-item:last-child {
            border-bottom: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2 class="text-center mb-4">PDF转Markdown工具</h2>
        
        <!-- 输入设置 -->
        <div class="section">
            <h4 class="section-title">输入设置</h4>
            <div class="btn-group">
                <button class="btn btn-primary" onclick="document.getElementById('fileInput').click()">选择文件</button>
                <button class="btn btn-primary" onclick="document.getElementById('folderInput').click()">选择文件夹</button>
            </div>
            <input type="file" id="fileInput" class="hidden-file-input" accept=".pdf" multiple>
            <input type="file" id="folderInput" class="hidden-file-input" webkitdirectory directory multiple>
            <div id="fileList" class="file-list"></div>
        </div>

        <!-- 输出设置 -->
        <div class="section">
            <h4 class="section-title">输出设置</h4>
            <div class="mb-3">
                <button class="btn btn-primary" onclick="document.getElementById('outputInput').click()">选择输出目录</button>
                <input type="file" id="outputInput" class="hidden-file-input" webkitdirectory directory>
                <div id="outputPath" class="mt-2">未选择输出目录</div>
            </div>
        </div>

        <!-- 转换设置 -->
        <div class="section">
            <h4 class="section-title">转换设置</h4>
            <div class="settings-row">
                <label class="form-label">转换质量:</label>
                <select id="quality" class="form-select">
                    <option value="low">低 (快速)</option>
                    <option value="normal" selected>中 (推荐)</option>
                    <option value="high">高 (较慢)</option>
                </select>
            </div>
            <div class="settings-row">
                <label class="form-label">OCR模式:</label>
                <select id="ocrMode" class="form-select">
                    <option value="auto" selected>自动 (推荐)</option>
                    <option value="force">强制OCR</option>
                    <option value="skip">跳过OCR</option>
                </select>
            </div>
            <div class="settings-row">
                <label class="form-label">处理模式:</label>
                <select id="processMode" class="form-select">
                    <option value="single">单进程</option>
                    <option value="multi" selected>多进程 (推荐)</option>
                </select>
            </div>
            <div class="settings-row">
                <label class="form-label">线程数:</label>
                <input type="number" id="threadCount" class="form-control" min="1" value="4">
            </div>
        </div>

        <!-- 转换进度 -->
        <div class="section">
            <h4 class="section-title">转换进度</h4>
            <div class="progress mb-3">
                <div id="totalProgress" class="progress-bar" role="progressbar" style="width: 0%">0%</div>
            </div>
            <div class="progress mb-3">
                <div id="fileProgress" class="progress-bar" role="progressbar" style="width: 0%">0%</div>
            </div>
            <div id="currentFile" class="mb-3">等待开始...</div>
            <div class="log-container" id="logContainer"></div>
        </div>

        <!-- 操作按钮 -->
        <div class="text-center">
            <button id="startButton" class="btn btn-success" onclick="startConversion()" disabled>开始转换</button>
            <button id="stopButton" class="btn btn-danger" onclick="stopConversion()" disabled>停止转换</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/socket.io-client@4/dist/socket.io.min.js"></script>
    <script>
        let socket = io();
        let selectedFiles = [];
        let outputDirectory = '';
        let isConverting = false;

        // 文件选择处理
        document.getElementById('fileInput').addEventListener('change', function(e) {
            handleFileSelection(e.target.files);
        });

        document.getElementById('folderInput').addEventListener('change', function(e) {
            handleFileSelection(e.target.files);
        });

        document.getElementById('outputInput').addEventListener('change', function(e) {
            if (e.target.files.length > 0) {
                outputDirectory = e.target.files[0].path;
                document.getElementById('outputPath').textContent = `已选择: ${outputDirectory}`;
                updateStartButton();
            }
        });

        function handleFileSelection(files) {
            selectedFiles = Array.from(files).filter(file => file.name.toLowerCase().endsWith('.pdf'));
            updateFileList();
            updateStartButton();
        }

        function updateFileList() {
            const fileList = document.getElementById('fileList');
            fileList.innerHTML = '';
            selectedFiles.forEach(file => {
                const fileItem = document.createElement('div');
                fileItem.className = 'file-item';
                fileItem.textContent = file.name;
                fileList.appendChild(fileItem);
            });
        }

        function updateStartButton() {
            document.getElementById('startButton').disabled = 
                selectedFiles.length === 0 || !outputDirectory || isConverting;
        }

        // WebSocket事件处理
        socket.on('connect', function() {
            addLog('已连接到服务器');
        });

        socket.on('disconnect', function() {
            addLog('与服务器断开连接');
        });

        socket.on('status_update', function(status) {
            isConverting = status.is_converting;
            document.getElementById('totalProgress').style.width = `${status.total_progress}%`;
            document.getElementById('totalProgress').textContent = `${Math.round(status.total_progress)}%`;
            document.getElementById('fileProgress').style.width = `${status.file_progress}%`;
            document.getElementById('fileProgress').textContent = `${Math.round(status.file_progress)}%`;
            document.getElementById('currentFile').textContent = 
                status.current_file ? `正在处理: ${status.current_file}` : '等待开始...';
            
            document.getElementById('startButton').disabled = isConverting;
            document.getElementById('stopButton').disabled = !isConverting;
        });

        socket.on('log', function(data) {
            addLog(data.message);
        });

        socket.on('conversion_complete', function() {
            addLog('转换完成！');
            isConverting = false;
            updateStartButton();
        });

        function addLog(message) {
            const logContainer = document.getElementById('logContainer');
            const logEntry = document.createElement('div');
            logEntry.className = 'log-entry';
            logEntry.textContent = message;
            logContainer.appendChild(logEntry);
            logContainer.scrollTop = logContainer.scrollHeight;
        }

        // 转换控制
        async function startConversion() {
            if (selectedFiles.length === 0 || !outputDirectory) {
                alert('请选择输入文件和输出目录');
                return;
            }

            const formData = new FormData();
            selectedFiles.forEach(file => {
                formData.append('files[]', file);
            });
            formData.append('output_dir', outputDirectory);
            formData.append('settings', JSON.stringify({
                quality: document.getElementById('quality').value,
                ocr_mode: document.getElementById('ocrMode').value,
                process_mode: document.getElementById('processMode').value,
                thread_count: parseInt(document.getElementById('threadCount').value)
            }));

            try {
                const response = await fetch('/api/start_conversion', {
                    method: 'POST',
                    body: formData
                });
                
                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.error || '转换启动失败');
                }

                isConverting = true;
                updateStartButton();
                document.getElementById('stopButton').disabled = false;
                addLog('开始转换...');
            } catch (error) {
                addLog(`错误: ${error.message}`);
            }
        }

        async function stopConversion() {
            try {
                const response = await fetch('/api/stop_conversion', {
                    method: 'POST'
                });
                
                if (!response.ok) {
                    throw new Error('停止转换失败');
                }

                addLog('正在停止转换...');
            } catch (error) {
                addLog(`错误: ${error.message}`);
            }
        }

        // 检查依赖
        async function checkDependencies() {
            try {
                const response = await fetch('/api/check_dependencies');
                const data = await response.json();
                
                if (data.errors && data.errors.length > 0) {
                    data.errors.forEach(error => addLog(`警告: ${error}`));
                } else {
                    addLog('所有依赖检查通过');
                }
            } catch (error) {
                addLog(`依赖检查失败: ${error.message}`);
            }
        }

        // 页面加载完成后检查依赖
        window.addEventListener('load', checkDependencies);
    </script>
</body>
</html>
